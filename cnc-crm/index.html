<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C&C CRM</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/services/storage.js" defer></script>
  <script src="js/pages/leads.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="header">
    <h1>C&C CRM</h1>
    <nav>
      <button data-page="dashboard">Dashboard</button>
      <button data-page="leads">Leads</button>
    </nav>
  </header>

  <main>
    <section id="dashboardPage" class="page">
      <h2>Dashboard</h2>
      <p>Our CRM learning project.</p>
      <p>Total Leads: <strong id="leadCount">0</strong></p>
    </section>

    <section id="leadsPage" class="page hidden">
      <div class="page-header">
        <h2>Leads</h2>
        <button id="addLeadButton">+ Add Lead</button>
      </div>

      <form id="leadForm" class="lead-form hidden">
        <input id="leadName" type="text" placeholder="Lead name" required>
        <input id="leadEmail" type="email" placeholder="Email" required>
        <input id="leadPhone" type="tel" placeholder="Phone">
        <button type="submit">Save Lead</button>
        <button type="button" id="cancelLead">Cancel</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
          </tr>
        </thead>
        <tbody id="leadsTable"></tbody>
      </table>
    </section>
  </main>
</body>
</html>
